desktop:
  keyboardLayout: us
  browserStartUrl: https://start.duckduckgo.com/
  fontSans: DejaVu Sans
  fontMono: DejaVu Sans Mono
  fontSize: 10
  gtkTheme: Adwaita-dark
  iconTheme: Papirus-Dark
  cursorTheme: Adwaita
  clipboard:
    history: false
  idle:
    lockSeconds: 300
    displaySeconds: 600
  theme:
    background: "#222222"
    backgroundAlt: "#2a2a2a"
    surface: "#333333"
    foreground: "#bec1bf"
    muted: "#969996"
    accent: "#df970d"
    accentAlt: "#6aaa64"
    urgent: "#c65d5d"
    blue: "#7197b0"
    pink: "#b16286"
    cyan: "#7faaa2"
packages:
  install: false
  tier: recommended
